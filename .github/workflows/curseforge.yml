name: Package and publish GatherLite Forever

on:
  push:
    tags:
      - "*-forever.*"
  # Manual runs build a downloadable ZIP without publishing it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate release ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python tools/package_forever.py --version "$RELEASE_TAG"
      - name: Retain reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: GatherLite-${{ steps.package.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Publish to the existing GatherLite project
        if: github.event_name == 'push'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: "334918"
          game_endpoint: "wow"
          file_path: ${{ steps.package.outputs.archive }}
          display_name: GatherLite ${{ steps.package.outputs.version }}
          game_versions: "1.60.1"
          release_type: release
          changelog_type: markdown
          changelog: ${{ steps.package.outputs.changelog }}
